<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1150" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);">
  <defs>
    <linearGradient id="kingGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="counselor1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8E44AD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="counselor2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980B9;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Título -->
  <text x="500" y="60" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white" text-anchor="middle">
    👑 EL REY Y SUS CONSEJEROS
  </text>
  <text x="500" y="95" font-family="Arial, sans-serif" font-size="20" fill="#B0D4FF" text-anchor="middle">
    Mecanismos de Hipertrofia Muscular
  </text>
  
  <!-- EL REY - Tensión Mecánica -->
  <rect x="200" y="130" width="600" height="320" rx="25" fill="url(#kingGold)" filter="url(#shadow)"/>
  
  <circle cx="500" cy="230" r="60" fill="white" opacity="0.3" filter="url(#glow)"/>
  <text x="500" y="250" font-family="Arial, sans-serif" font-size="80" text-anchor="middle">👑</text>
  
  <text x="500" y="330" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">
    TENSIÓN MECÁNICA
  </text>
  <text x="500" y="365" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a1a2e" text-anchor="middle">
    "EL REY SUPREMO"
  </text>
  
  <text x="500" y="400" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">
    ⚡ Sin carga = Sin músculo
  </text>
  <text x="500" y="425" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">
    ⚡ Activa vía mTOR (Mammalian Target of Rapamycin)
  </text>
  
  <rect x="230" y="185" width="80" height="30" rx="10" fill="#1a1a2e"/>
  <text x="270" y="206" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFD700" text-anchor="middle">
    ESENCIAL
  </text>
  
  <!-- Flecha hacia consejeros -->
  <path d="M 500 455 L 500 485" stroke="white" stroke-width="4" fill="none" marker-end="url(#arrowWhite)"/>
  <defs>
    <marker id="arrowWhite" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="white"/>
    </marker>
  </defs>
  
  <!-- LOS CONSEJEROS -->
  <text x="500" y="520" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">
    LOS CONSEJEROS (Potenciadores)
  </text>
  
  <!-- Consejero 1. Estrés Metabólico -->
  <rect x="80" y="550" width="400" height="280" rx="20" fill="url(#counselor1)" filter="url(#shadow)"/>
  
  <circle cx="280" cy="620" r="40" fill="white" opacity="0.3"/>
  <text x="280" y="640" font-family="Arial, sans-serif" font-size="60" text-anchor="middle">🔥</text>
  
  <text x="280" y="700" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">
    ESTRÉS METABÓLICO
  </text>
  <text x="280" y="730" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">
    "El Alquimista"
  </text>
  
  <text x="280" y="765" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">
    💥 Lactato, H⁺, ADP, Pi
  </text>
  <text x="280" y="788" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">
    💧 Edema celular (pump)
  </text>
  <text x="280" y="811" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">
    🧪 Respuesta hormonal
  </text>
  
  <!-- Consejero 2: Daño Muscular -->
  <rect x="520" y="550" width="400" height="280" rx="20" fill="url(#counselor2)" filter="url(#shadow)"/>
  
  <circle cx="720" cy="620" r="40" fill="white" opacity="0.3"/>
  <text x="720" y="640" font-family="Arial, sans-serif" font-size="60" text-anchor="middle">⚔️</text>
  
  <text x="720" y="700" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">
    DAÑO MUSCULAR
  </text>
  <text x="720" y="730" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">
    "El Constructor"
  </text>
  
  <text x="720" y="765" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">
    🔨 Micro-roturas (Z-discs)
  </text>
  <text x="720" y="788" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">
    🧬 Respuesta inflamatoria
  </text>
  <text x="720" y="811" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">
    📈 Remodelación + refuerzo
  </text>
  
  <!-- Cuadro de advertencia -->
  <rect x="100" y="860" width="800" height="120" rx="15" fill="white" opacity="0.95" filter="url(#shadow)"/>
  
  <text x="500" y="895" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#C62828" text-anchor="middle">
    ⚠️ ADVERTENCIA: Sin el Rey, los consejeros no sirven
  </text>
  
  <text x="500" y="925" font-family="Arial, sans-serif" font-size="15" fill="#333" text-anchor="middle">
    • No puedes quemar el músculo sin cargarlo: El pump solo NO construye
  </text>
  <text x="500" y="950" font-family="Arial, sans-serif" font-size="15" fill="#333" text-anchor="middle">
    • No puedes destruirlo sin reconstruirlo: El daño extremo = Catabolismo
  </text>
  <text x="500" y="975" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32" text-anchor="middle">
    ✅ LA FÓRMULA: Tensión Mecánica PRIMERO + Potenciadores DESPUÉS
  </text>
  
  <!-- Ecuación de hipertrofia -->
  <rect x="150" y="1010" width="700" height="80" rx="15" fill="#FFD700" opacity="0.2" stroke="#FFD700" stroke-width="3"/>
  <text x="500" y="1045" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">
    👑 Tensión Mecánica (Carga Progresiva)
  </text>
  <text x="500" y="1070" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">
    + 🔥 Estrés Metabólico (TUT, descansos cortos) + ⚔️ Daño Muscular (excéntricas, ROM)
  </text>
  
  <!-- Footer -->
  <text x="500" y="1130" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white" opacity="0.7">
    Módulo 2.2 - Mecanismos de Hipertrofia | Curso de Optimización de Entrenamientos
  </text>
</svg>
